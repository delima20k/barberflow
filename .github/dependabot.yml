# .github/dependabot.yml — Configuração de atualizações automáticas de dependências
#
# Mantém o projeto protegido contra vulnerabilidades conhecidas.
# Referência: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # ── BFF Node.js ────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /barberflow-bff-api
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    # Agrupar atualizações de patch/minor para reduzir ruído de PRs
    groups:
      production-dependencies:
        applies-to:    version-updates
        patterns:      ['*']
        update-types:  ['minor', 'patch']
        dependency-type: production
      security-patches:
        applies-to:    security-updates
        patterns:      ['*']
    # Limitar PRs abertos simultaneamente
    open-pull-requests-limit: 5
    # Labels para triagem
    labels:
      - dependencies
      - security
    # Não auto-merge — requer revisão humana para minor/major
    reviewers:
      - '@barberflow/backend'
    # Prefixo de commit seguindo Conventional Commits
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
      include: scope

  # ── Root package.json (se existir) ────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: 'deps(root)'

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: 'ci(actions)'
