name: Deploy finance hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-finance-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-finance-hotfix:
    name: Validate and deploy finance migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate finance and RLS regressions
        run: |
          node --test \
            tests/queue-entry-services-partner-rls.test.js \
            tests/financeiro-transactions-realtime.test.js \
            tests/financeiro-service.test.js \
            tests/financas-page-evento.test.js
          node scripts/db-snapshot.js --check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify production secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Guard pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --dry-run \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes 2>&1 | tee migration-dry-run.log

          mapfile -t pending < <(
            grep -oE '[0-9]{14}_[a-z0-9_]+(\.sql)?' migration-dry-run.log \
              | sed 's/\.sql$//' \
              | sort -u
          )

          for migration in "${pending[@]}"; do
            case "$migration" in
              20260722000002_transactions_financeiro_realtime) ;;
              20260723000001_queue_entry_services_partner_rls) ;;
              *)
                echo "::error::Migration fora do escopo detectada: $migration"
                exit 1
                ;;
            esac
          done

      - name: Push guarded migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes
