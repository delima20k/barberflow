# ==============================================================================
# GitHub Actions: db-tests.yml — Testes de Schema e Contrato de RPCs
#
# Gatilho:
#   • Push/PR em qualquer branch que modifique migrations ou contratos
#   • Push/PR direto em main/develop (sempre valida)
#
# Jobs:
#   1. schema-snapshot  — verifica que o snapshot em db/snapshots/ está atualizado
#   2. contract-tests   — roda tests/db-contracts.test.js (sem banco real)
#   3. snapshot-tests   — roda tests/db-schema-snapshot.test.js
#   4. rpc-coverage     — relatório de cobertura de contratos; falha se críticas sem contrato
#   5. rls-coverage     — report de RLS: falha tabela sem RLS e publica warnings por operação
#
# Bloqueia merge se qualquer job falhar.
# ==============================================================================

name: DB Tests (Schema + Contratos)

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'supabase/migrations/**'
      - 'db/contracts/**'
      - 'db/snapshots/**'
      - 'scripts/db-*.js'
      - 'scripts/rls-policy-report.js'
      - 'tests/db-*.test.js'
      - 'tests/rls-policy-report.test.js'
      - 'db/rls/**'
      - 'supabase/tests/**'
      - '.github/workflows/db-tests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'supabase/migrations/**'
      - 'db/contracts/**'
      - 'db/snapshots/**'
      - 'scripts/db-*.js'
      - 'scripts/rls-policy-report.js'
      - 'tests/db-*.test.js'
      - 'tests/rls-policy-report.test.js'
      - 'db/rls/**'
      - 'supabase/tests/**'

env:
  NODE_VERSION: '22'

# ── Job 1: Schema Snapshot ─────────────────────────────────────────────────────
jobs:
  schema-snapshot:
    name: Schema Snapshot Diff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verificar que snapshot está atualizado
        run: |
          echo "Verificando conformidade do snapshot de schema..."
          node scripts/db-snapshot.js --check
          echo "✅ Snapshot em conformidade."

      - name: Verificar hash do snapshot
        run: |
          if [ ! -f db/snapshots/schema.hash ]; then
            echo "❌ ERRO: db/snapshots/schema.hash não encontrado."
            echo "   Execute: node scripts/db-snapshot.js && git add db/snapshots/ && git commit"
            exit 1
          fi
          echo "✅ db/snapshots/schema.hash presente."
          echo "   Hash: $(cat db/snapshots/schema.hash)"

      - name: Verificar que schema-current.sql está commitado
        run: |
          if [ ! -f db/snapshots/schema-current.sql ]; then
            echo "❌ ERRO: db/snapshots/schema-current.sql não encontrado."
            echo "   Execute: node scripts/db-snapshot.js && git add db/snapshots/ && git commit"
            exit 1
          fi
          echo "✅ db/snapshots/schema-current.sql presente."

# ── Job 2: Contract Tests ──────────────────────────────────────────────────────
  contract-tests:
    name: Contract Tests (RPCs)
    runs-on: ubuntu-latest
    needs: schema-snapshot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Rodar testes de contrato
        run: |
          echo "Executando testes de contrato das RPCs críticas..."
          node --test tests/db-contracts.test.js
          echo "✅ Testes de contrato passaram."

# ── Job 3: Snapshot Tests ──────────────────────────────────────────────────────
  snapshot-tests:
    name: Snapshot System Tests
    runs-on: ubuntu-latest
    needs: schema-snapshot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Rodar testes do sistema de snapshot
        run: |
          echo "Executando testes do sistema de snapshot..."
          node --test tests/db-schema-snapshot.test.js
          echo "✅ Testes de snapshot passaram."

# ── Job 4: RPC Coverage Report ─────────────────────────────────────────────────
  rpc-coverage:
    name: RPC Contract Coverage
    runs-on: ubuntu-latest
    needs: [contract-tests, snapshot-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Gerar relatório de cobertura de contratos
        run: |
          echo "Gerando relatório de cobertura de RPCs..."
          node scripts/db-diff.js --coverage

      - name: Verificar RPCs críticas têm contrato
        run: |
          CRITICAL_RPCS=(
            "criar_agendamento_atomico"
            "confirmar_presenca_cliente"
            "buscar_perfis_por_nome"
            "search_users"
            "get_clientes_favoritos_modal"
            "get_clientes_favoritos_barbearia"
            "notificar_barbeiro_chegada"
          )

          FAILED=0
          for rpc in "${CRITICAL_RPCS[@]}"; do
            if [ ! -f "db/contracts/snapshots/${rpc}.json" ]; then
              echo "❌ RPC crítica sem contrato: ${rpc}"
              echo "   Crie: db/contracts/snapshots/${rpc}.json"
              echo "   Documente: db/contracts/${rpc}.md"
              FAILED=1
            else
              echo "✅ ${rpc}"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ FALHA: RPCs críticas sem contrato documentado."
            echo "   Toda nova RPC crítica DEVE ter contrato antes do merge."
            exit 1
          fi

          echo ""
          echo "✅ Todas as RPCs críticas têm contrato documentado."

      - name: Upload relatório como artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rpc-coverage-report
          path: db/contracts/
          retention-days: 30

# ── Job 5: RLS Coverage Report ─────────────────────────────────────────────────
  rls-coverage:
    name: RLS Policy Coverage
    runs-on: ubuntu-latest
    needs: schema-snapshot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Rodar testes do framework RLS
        run: |
          echo "Executando meta-testes do framework de RLS..."
          node --test tests/rls-policy-report.test.js

      - name: Gerar report de cobertura RLS
        run: |
          echo "Gerando report RLS..."
          node scripts/rls-policy-report.js --fail-on-missing-rls > rls-coverage-report.md
          cat rls-coverage-report.md

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir banco isolado via Docker
        run: supabase start

      - name: Recriar banco e seeds
        run: supabase db reset

      - name: Rodar suite SQL de RLS no banco isolado
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls_crud_suite.sql

      - name: Encerrar Supabase local
        if: always()
        run: supabase stop --no-backup

      - name: Upload report RLS como artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rls-coverage-report
          path: rls-coverage-report.md
          retention-days: 30
