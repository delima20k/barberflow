# ==============================================================
# GitHub Actions: deploy-supabase.yml
# Gatão 1: push direto na main (garantia principal)
# Gatão 2: após o workflow "Validate BarberFlow" concluir com sucesso
# Gatão 3: dispatch manual pelo GitHub Actions UI
# Objetivo: aplicar migrations e deploy das Edge Functions
# Secrets obrigatórios (Settings > Secrets > Actions):
#   - SUPABASE_ACCESS_TOKEN
#   - SUPABASE_PROJECT_REF
#   - SUPABASE_DB_PASSWORD
# ==============================================================

name: Deploy Supabase (main)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Validate BarberFlow']
    types: [completed]
    branches: [main]

jobs:
  db-validate:
    name: db-validate before deploy
    uses: ./.github/workflows/db-validate.yml
    secrets: inherit

  deploy:
    name: Deploy migrations + functions
    runs-on: ubuntu-latest
    environment: production
    needs: db-validate

    # IMPORTANTE: if: multiline com | é inválido no GitHub Actions — o job
    # era descartado silenciosamente em todo push. Corrigido para linha única.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Valida secrets obrigatórios antes de qualquer operação — falha rápido com mensagem clara
      - name: Verificar secrets obrigatórios
        run: |
          MISSING=0
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && echo "❌ SUPABASE_ACCESS_TOKEN ausente"  && MISSING=1 || echo "✅ SUPABASE_ACCESS_TOKEN presente"
          [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]  && echo "❌ SUPABASE_PROJECT_REF ausente"   && MISSING=1 || echo "✅ SUPABASE_PROJECT_REF presente"
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]  && echo "❌ SUPABASE_DB_PASSWORD ausente"   && MISSING=1 || echo "✅ SUPABASE_DB_PASSWORD presente"
          [ "$MISSING" = "1" ] && echo "Configure os secrets em: Settings > Secrets > Actions" && exit 1
          exit 0

      # Instala a Supabase CLI via script oficial
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Autentica e linka o projeto remoto
      - name: Link Supabase project
        run: |
          supabase link \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --password    ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Aplica as migrations pendentes no banco remoto
      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy de todas as Edge Functions
      - name: Deploy Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            func_name=$(basename "$dir")
            echo "Deploying function: $func_name"
            supabase functions deploy "$func_name" --no-verify-jwt
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy summary
        run: |
          echo "Deploy concluído com sucesso."
          echo "Projeto: ${{ secrets.SUPABASE_PROJECT_REF }}"
          echo "Branch:  main"
          echo "Data:    $(date -u)"
